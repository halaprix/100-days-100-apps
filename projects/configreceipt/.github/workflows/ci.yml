name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required project files
        run: |
          test -f README.md
          test -f SPEC.md
          test -f AGENTS.md
          test -f CHANGELOG.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f .beads/issues.jsonl
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD
