name: CI

on:
  push:
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate required scaffold files
        run: |
          set -euo pipefail
          test -f README.md
          test -f SPEC.md
          test -f AGENTS.md
          test -f CHANGELOG.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
      - name: Public safety smoke check
        run: |
          set -euo pipefail
          # Character classes avoid the scanner matching this workflow line itself.
          ! grep -RInE '(api[_-]?key|tok[e]n=|sec[r]et=|pass[w]ord=)' . \
            --exclude-dir=.git --exclude-dir=.beads
