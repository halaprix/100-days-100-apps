name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required scaffold files
        run: |
          set -euo pipefail
          test -f README.md
          test -f SPEC.md
          test -f AGENTS.md
          test -f CHANGELOG.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f .beads/issues.jsonl
      - name: Verify synthetic-only fixture policy
        run: |
          set -euo pipefail
          test ! -d fixtures || ! git grep -n '@' -- fixtures
