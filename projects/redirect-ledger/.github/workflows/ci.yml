name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scaffold:
    name: scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify required public files
        run: |
          test -f README.md
          test -f SPEC.md
          test -f AGENTS.md
          test -f CHANGELOG.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f .beads/issues.jsonl
      - name: check whitespace
        run: git diff --check HEAD^ HEAD || test "$(git rev-list --count HEAD)" = "1"
