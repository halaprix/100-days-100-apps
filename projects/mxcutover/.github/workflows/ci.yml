name: CI

on:
  push:
  pull_request:

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scaffold
        run: |
          set -euo pipefail
          test -f README.md
          test -f SPEC.md
          test -f AGENTS.md
          test -f CHANGELOG.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          grep -q "MxCutover" README.md
          grep -q "User story" SPEC.md
          if grep -RInE 'BEGIN .*PRIVATE KEY|xox[baprs]-|ghp_[A-Za-z0-9]+' . --exclude-dir=.git --exclude-dir=.beads --exclude=ci.yml; then
            echo "Potential secret marker found"
            exit 1
          fi
