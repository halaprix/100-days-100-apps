name: CI

on:
  push:
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required scaffold files
        run: |
          test -f README.md
          test -f SPEC.md
          test -f AGENTS.md
          test -f CHANGELOG.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
      - name: Check for obvious placeholder secrets
        run: |
          ! grep -RInE '(api[_-]?key|secret|token|password) *= *[A-Za-z0-9_./+-]{16,}' . --exclude-dir=.git --exclude-dir=.beads
