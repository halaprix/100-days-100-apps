name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scaffold
        run: |
          set -euo pipefail
          test -f README.md
          test -f SPEC.md
          test -f AGENTS.md
          test -f CHANGELOG.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -s .beads/issues.jsonl
          grep -q "StorePacket" README.md
          grep -q "no-credentials" README.md
