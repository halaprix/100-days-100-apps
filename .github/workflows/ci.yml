name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate JSON
        run: python3 -m json.tool index.json >/tmp/index.json
      - name: Verify consolidated project snapshots
        run: python3 scripts/verify-consolidated-projects.py
